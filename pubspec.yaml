name: store_manager_pro
description: Store Manager Pro Ultimate - Professional Store Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # UI & Design
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  data_table_2: ^2.5.15

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  local_auth: ^2.2.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3

  # Barcode & QR
  barcode_widget: ^2.0.4
  qr_flutter: ^4.1.0

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0

  # File Operations
  file_picker: ^8.0.6

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.5

  # Notifications
  flutter_local_notifications: ^17.2.1+2

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
